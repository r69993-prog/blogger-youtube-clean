import os
import pickle
from datetime import datetime
import json
from google_auth_oauthlib.flow import InstalledAppFlow
from google.auth.transport.requests import Request
from googleapiclient.discovery import build

# กำหนด Path พื้นฐานให้อ้างอิงจากตำแหน่งของไฟล์ main.py เสมอ
BASE_DIR = os.path.dirname(os.path.abspath(__file__))
TOKEN_PATH = os.path.join(BASE_DIR, 'token.pickle')
CLIENT_SECRETS_PATH = os.path.join(BASE_DIR, 'client_secrets.json')
CONFIG_PATH = os.path.join(BASE_DIR, 'config.json')

SCOPES = ['https://www.googleapis.com/auth/blogger']

def main():
    print("====================================")
    print(f"[!] เริ่มทำงานรอบอัตโนมัติ เวลา: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}")
    print("====================================")

    if not os.path.exists(TOKEN_PATH):
        raise FileNotFoundError(f"ไม่พบไฟล์ token.pickle ที่ path: {TOKEN_PATH}")

    with open(TOKEN_PATH, 'rb') as token:
        creds = pickle.load(token)

    if not creds or not creds.valid:
        if creds and creds.expired and creds.refresh_token:
            creds.refresh(Request())
        else:
            flow = InstalledAppFlow.from_client_secrets_file(CLIENT_SECRETS_PATH, SCOPES)
            creds = flow.run_local_server(port=8080)
        with open(TOKEN_PATH, 'wb') as token:
            pickle.dump(creds, token)

    blogger_service = build('blogger', 'v3', credentials=creds)
    print("เชื่อมต่อ Google API สำเร็จ พร้อมทำงานต่อ")

if __name__ == '__main__':
    main()